<body>
  <h1 class="title">Word Guessing Game </h1>
  <div id="levelContainer" class="level-map"></div>

  <svg width="0" height="0">
    <defs>
      <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="gold"/>
        <stop offset="100%" stop-color="orange"/>
      </linearGradient>
      <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#bbb"/>
        <stop offset="100%" stop-color="#eee"/>
      </linearGradient>
      <filter id="glow-gold">
        <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="gold"/>
      </filter>
      <filter id="glow-silver">
        <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="silver"/>
      </filter>
    </defs>
  </svg>
